---
doc: |
  Build and install fil and its dependencies from source on the target

  * Transfers the fil checkout to the target
  * Installs system packages via toolbox/pkgs and the CUDA toolkit
  * Retrieves xNVMe and xal at the versions given by the config, then builds
    and installs them
  * Builds fil as debug with warnings as errors, with sub-timers enabled, and
    as release; the release build is installed
  * Builds the Python binding against the installed fil and imports it
  * Formats config.fil.testing.dev with XFS, populates it with a dataset, and
    tests reading it with the posix backend, which needs no GPU

  Run with a config giving the target transport, as root, and configs/fil.toml:

    cijoe --monitor \
      -c configs/qemu_guest.toml \
      -c configs/fil.toml \
      workflows/verify.yaml

  Each line of a 'run' is a separate shell, hence the PATH given per command
  for meson to find nvcc.

steps:
- name: sysinfo
  run: |
    uname -a
    cat /etc/os-release
    nproc
    free -m

- name: fil_source
  uses: fil_source_put

- name: pkgs
  run: |
    {{ config.fil.source }}/toolbox/pkgs/{{ config.os.distro }}-{{ config.os.version }}.sh

- name: cuda
  uses: cuda_install

- name: fetch_sources
  uses: core.repository_prep

- name: xnvme_build
  run: |
    git -C {{ config.xnvme.repository.path }} log -1 --oneline
    rm -rf {{ config.xnvme.repository.path }}/builddir
    PATH={{ config.cuda.path }}/bin:$PATH meson setup {{ config.xnvme.repository.path }}/builddir {{ config.xnvme.repository.path }} {{ config.xnvme.build.options }}
    PATH={{ config.cuda.path }}/bin:$PATH meson compile -C {{ config.xnvme.repository.path }}/builddir

- name: xnvme_install
  run: |
    meson install -C {{ config.xnvme.repository.path }}/builddir --no-rebuild
    ldconfig
    pkg-config --modversion xnvme

- name: xal_build
  run: |
    git -C {{ config.xal.repository.path }} log -1 --oneline
    rm -rf {{ config.xal.repository.path }}/builddir
    meson setup {{ config.xal.repository.path }}/builddir {{ config.xal.repository.path }}
    meson compile -C {{ config.xal.repository.path }}/builddir

- name: xal_install
  run: |
    meson install -C {{ config.xal.repository.path }}/builddir --no-rebuild
    ldconfig
    pkg-config --modversion xal

- name: fil_build_debug
  run: |
    rm -rf {{ config.fil.source }}/builddir-debug
    PATH={{ config.cuda.path }}/bin:$PATH meson setup {{ config.fil.source }}/builddir-debug {{ config.fil.source }} --buildtype=debug -Dwerror=true
    PATH={{ config.cuda.path }}/bin:$PATH meson compile -C {{ config.fil.source }}/builddir-debug

- name: fil_build_subtime
  run: |
    rm -rf {{ config.fil.source }}/builddir-subtime
    PATH={{ config.cuda.path }}/bin:$PATH meson setup {{ config.fil.source }}/builddir-subtime {{ config.fil.source }} -Dsubtime=true
    PATH={{ config.cuda.path }}/bin:$PATH meson compile -C {{ config.fil.source }}/builddir-subtime

- name: fil_build
  run: |
    PATH={{ config.cuda.path }}/bin:$PATH make -C {{ config.fil.source }} clean config build

- name: fil_install
  run: |
    meson install -C {{ config.fil.source }}/builddir --no-rebuild
    ldconfig
    filperf --help

- name: fil_python
  run: |
    rm -rf {{ config.fil.venv }}
    python3 -m venv {{ config.fil.venv }}
    {{ config.fil.venv }}/bin/pip install {{ config.fil.source }}/python
    {{ config.fil.venv }}/bin/python -c "import fil; print(fil.__file__)"

- name: prep_xfs
  uses: prep_xfs

- name: prep_dataset
  uses: prep_dataset

- name: test
  uses: core.testrunner
  with:
    run_local: true
    random_order: false
    args: "tests"
